<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ✅ PWA META TAGS - START -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoZipMarket">
  <link rel="apple-touch-icon" href="/apple-icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <meta name="description" content="Email verification for GoZipMarket - Local Services">
  <!-- ✅ PWA META TAGS - END -->
  
  <title>Email Verification - ZipService</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background: #f5f5f5;
    }
    .container { 
      background: white; 
      padding: 40px; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
      text-align: center; 
      max-width: 500px;
      width: 90%;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #333; font-size: 28px; margin-bottom: 16px; }
    .email { color: #4A90E2; font-size: 14px; font-weight: 600; margin-bottom: 32px; }
    .spinner { 
      border: 4px solid #f3f3f3; 
      border-top: 4px solid #4A90E2; 
      border-radius: 50%; 
      width: 40px; 
      height: 40px; 
      animation: spin 1s linear infinite; 
      margin: 20px auto; 
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
    .success { color: #4CAF50; font-size: 24px; font-weight: bold; margin-bottom: 8px; }
    .error { color: #ef4444; font-size: 24px; font-weight: bold; margin-bottom: 8px; }
    .message { color: #666; font-size: 16px; margin-bottom: 24px; line-height: 1.5; }
    button { 
      background: #4CAF50; 
      color: white; 
      border: none; 
      padding: 16px 32px; 
      border-radius: 8px; 
      font-size: 18px; 
      font-weight: 600;
      cursor: pointer; 
      width: 100%;
    }
    button:hover { background: #45a049; }
    .error-info {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
      border-radius: 4px;
    }
    .env-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #4A90E2;
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📧</div>
    <h1>Email Verification</h1>
    <div id="email-display" class="email"></div>
    <div id="status">
      <div class="spinner"></div>
      <p class="message">Verifying your email...</p>
    </div>
  </div>

  <script>
    console.log('🔍 Email Verification Page Loaded');
    
    // ✅ AUTO-DETECT ENVIRONMENT
    const isLocalhost = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1';
    
    const API_BASE_URL = isLocalhost 
      ? 'http://localhost:5000'  // Development
      : 'https://gozipmarket-api.onrender.com';  // Production
    
    const FRONTEND_URL = isLocalhost
      ? 'http://localhost:8081'  // Development
      : 'https://gozipmarket.com';  // Production
    
    console.log('🌍 Environment:', isLocalhost ? 'DEVELOPMENT' : 'PRODUCTION');
    console.log('🔗 API URL:', API_BASE_URL);
    console.log('🔗 Frontend URL:', FRONTEND_URL);
    
    // Show environment badge in development
    if (isLocalhost) {
      const badge = document.createElement('div');
      badge.className = 'env-badge';
      badge.textContent = '🔧 DEV MODE';
      document.body.appendChild(badge);
    }
    
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');

    console.log('📧 Email:', email);
    console.log('🔑 Token (first 10):', token ? token.substring(0, 10) : 'missing');

    // Display email
    if (email) {
      document.getElementById('email-display').textContent = decodeURIComponent(email);
    }

    // Validate we have required params
    if (!token || !email) {
      console.error('❌ Missing token or email');
      document.getElementById('status').innerHTML = `
        <div class="error">❌ Invalid Link</div>
        <p class="message">This verification link is missing required information.</p>
        <button onclick="window.location.href='${FRONTEND_URL}'">Go to Home</button>
      `;
    } else {
      // Call verification API
      const verifyUrl = `${API_BASE_URL}/api/email-verification/verify`;
      console.log('📤 Calling verification API...');
      console.log('🌐 API URL:', verifyUrl);
      
      fetch(verifyUrl, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ 
          email: decodeURIComponent(email), 
          token: token 
        })
      })
      .then(response => {
        console.log('📥 Response status:', response.status);
        if (!response.ok) {
          return response.json().then(data => {
            throw new Error(data.error || data.message || `HTTP ${response.status}`);
          });
        }
        return response.json();
      })
      .then(data => {
        console.log('✅ Response data:', data);
        
        if (data.success) {
          if (data.alreadyVerified) {
            document.getElementById('status').innerHTML = `
              <div style="font-size: 80px; margin-bottom: 16px;">ℹ️</div>
              <div style="color: #2196F3; font-size: 24px; font-weight: bold; margin-bottom: 8px;">Already Verified</div>
              <p class="message">This email has already been verified.<br>You can sign in to your account.</p>
              <button onclick="window.location.href='${FRONTEND_URL}/signin'">
                🔐 Go to Sign In
              </button>
            `;
          } else {
            document.getElementById('status').innerHTML = `
              <div style="font-size: 80px; margin-bottom: 16px;">✅</div>
              <div class="success">Email Verified!</div>
              <p class="message">Your email has been successfully verified.<br>You can now sign in and access all features.</p>
              <button onclick="window.location.href='${FRONTEND_URL}/signin'">
                🔐 Go to Sign In
              </button>
            `;
          }
        } else {
          throw new Error(data.message || 'Verification failed');
        }
      })
      .catch(error => {
        console.error('❌ Verification error:', error);
        
        let errorMessage = error.message || 'An unexpected error occurred.';
        
        document.getElementById('status').innerHTML = `
          <div style="font-size: 80px; margin-bottom: 16px;">❌</div>
          <div class="error">Verification Failed</div>
          <p class="message">${errorMessage}</p>
          
          <div class="error-info">
            <strong>Common reasons:</strong>
            <ul>
              <li>Link has expired (valid for 24 hours)</li>
              <li>Link has already been used</li>
              <li>Invalid or corrupted link</li>
              <li>Network error - please try again</li>
            </ul>
          </div>
          
          <button onclick="window.location.href='${FRONTEND_URL}/signin'">
            🏠 Go to Sign In
          </button>
        `;
      });
    }
  </script>
</body>
</html>
