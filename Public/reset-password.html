<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ZipService</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background: #f5f5f5;
    }
    .container { 
      background: white; 
      padding: 40px; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
      max-width: 500px;
      width: 90%;
    }
    .header { text-align: center; margin-bottom: 32px; }
    .icon { font-size: 64px; }
    h1 { color: #333; font-size: 28px; margin: 16px 0 8px; }
    .subtitle { color: #666; font-size: 16px; }
    .email-display { color: #4A90E2; font-size: 14px; font-weight: 600; margin-top: 4px; }
    
    .input-group { margin-bottom: 20px; }
    label { display: block; font-size: 16px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .password-container { 
      display: flex; 
      align-items: center; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      background: #fff; 
    }
    input { 
      flex: 1; 
      padding: 12px 16px; 
      border: none; 
      font-size: 16px; 
      outline: none; 
    }
    .eye-icon { 
      padding: 12px; 
      cursor: pointer; 
      user-select: none; 
    }
    
    .requirements { 
      background: #f9f9f9; 
      border-radius: 8px; 
      padding: 16px; 
      margin-bottom: 20px; 
      border: 1px solid #e0e0e0; 
    }
    .requirements-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; }
    .requirement { display: flex; align-items: center; margin-bottom: 8px; font-size: 14px; color: #666; }
    .requirement .icon { font-size: 20px; margin-right: 8px; }
    .requirement.met { color: #4CAF50; font-weight: 500; }
    
    .match-indicator { display: flex; align-items: center; margin-top: 8px; font-size: 14px; }
    .match-indicator .icon { font-size: 16px; margin-right: 6px; }
    .match-success { color: #4CAF50; }
    .match-error { color: #ef4444; }
    
    button { 
      width: 100%; 
      background: #4CAF50; 
      color: white; 
      border: none; 
      padding: 16px; 
      border-radius: 8px; 
      font-size: 18px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 8px;
    }
    button:hover { background: #45a049; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    
    .back-button { 
      background: transparent; 
      color: #4A90E2; 
      border: 1px solid #4A90E2; 
      margin-top: 16px; 
    }
    .back-button:hover { background: #f0f8ff; }
    
    .spinner { 
      border: 3px solid #f3f3f3; 
      border-top: 3px solid #4CAF50; 
      border-radius: 50%; 
      width: 20px; 
      height: 20px; 
      animation: spin 1s linear infinite; 
      display: inline-block;
      margin-right: 8px;
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
    
    .alert { 
      padding: 12px; 
      border-radius: 8px; 
      margin-bottom: 20px; 
    }
    .alert-error { background: #fee; border-left: 4px solid #ef4444; color: #c00; }
    .alert-success { background: #efe; border-left: 4px solid #4CAF50; color: #080; }
    
    .env-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #4A90E2;
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">🔒</div>
      <h1>Set New Password</h1>
      <p class="subtitle">Enter your new password below</p>
      <div id="email-display" class="email-display"></div>
    </div>

    <div id="alert-container"></div>

    <form id="reset-form">
      <div class="input-group">
        <label>New Password</label>
        <div class="password-container">
          <input type="password" id="newPassword" placeholder="Enter new password" required>
          <span class="eye-icon" onclick="togglePassword('newPassword', 'eye1')">
            <span id="eye1">👁️</span>
          </span>
        </div>
      </div>

      <div class="requirements">
        <div class="requirements-title">Password must contain:</div>
        <div class="requirement" id="req-length">
          <span class="icon">⭕</span>
          <span>At least 8 characters</span>
        </div>
        <div class="requirement" id="req-upper">
          <span class="icon">⭕</span>
          <span>One uppercase letter (A-Z)</span>
        </div>
        <div class="requirement" id="req-lower">
          <span class="icon">⭕</span>
          <span>One lowercase letter (a-z)</span>
        </div>
        <div class="requirement" id="req-number">
          <span class="icon">⭕</span>
          <span>One number (0-9)</span>
        </div>
        <div class="requirement" id="req-special">
          <span class="icon">⭕</span>
          <span>One special character (!@#$%^&*)</span>
        </div>
      </div>

      <div class="input-group">
        <label>Confirm New Password</label>
        <div class="password-container">
          <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
          <span class="eye-icon" onclick="togglePassword('confirmPassword', 'eye2')">
            <span id="eye2">👁️</span>
          </span>
        </div>
        <div id="match-indicator" class="match-indicator" style="display:none;"></div>
      </div>

      <button type="submit" id="submit-btn">Reset Password</button>
      <button type="button" class="back-button" id="back-btn">
        ← Back to Sign In
      </button>
    </form>
  </div>

  <script>
    // ✅ AUTO-DETECT ENVIRONMENT
    const isLocalhost = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1';
    
    const API_BASE_URL = isLocalhost 
      ? 'http://localhost:5000'  // Development
      : 'https://gozipmarket-api.onrender.com';  // Production
    
    const FRONTEND_URL = isLocalhost
      ? 'http://localhost:8081'  // Development
      : 'https://gozipmarket.com';  // Production
    
    console.log('🌍 Environment:', isLocalhost ? 'DEVELOPMENT' : 'PRODUCTION');
    console.log('🔗 API URL:', API_BASE_URL);
    console.log('🔗 Frontend URL:', FRONTEND_URL);
    
    // Show environment badge in development
    if (isLocalhost) {
      const badge = document.createElement('div');
      badge.className = 'env-badge';
      badge.textContent = '🔧 DEV MODE';
      document.body.appendChild(badge);
    }
    
    // Set back button URL
    document.getElementById('back-btn').onclick = () => {
      window.location.href = `${FRONTEND_URL}/signin`;
    };

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');

    console.log('📧 Email:', email);
    console.log('🔑 Token (first 10):', token ? token.substring(0, 10) : 'missing');

    // Display email
    if (email) {
      document.getElementById('email-display').textContent = 'for ' + decodeURIComponent(email);
    }

    // Validate required params
    if (!token || !email) {
      showAlert('Invalid reset link. Please request a new password reset.', 'error');
      document.getElementById('reset-form').style.display = 'none';
    }

    // Password validation state
    const validation = {
      minLength: false,
      hasUpperCase: false,
      hasLowerCase: false,
      hasNumber: false,
      hasSpecialChar: false
    };

    // Validate password as user types
    document.getElementById('newPassword').addEventListener('input', (e) => {
      const password = e.target.value;
      
      validation.minLength = password.length >= 8;
      validation.hasUpperCase = /[A-Z]/.test(password);
      validation.hasLowerCase = /[a-z]/.test(password);
      validation.hasNumber = /[0-9]/.test(password);
      validation.hasSpecialChar = /[!@#$%^&*]/.test(password);

      updateRequirements();
      checkPasswordMatch();
    });

    document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

    function updateRequirements() {
      document.getElementById('req-length').className = validation.minLength ? 'requirement met' : 'requirement';
      document.getElementById('req-upper').className = validation.hasUpperCase ? 'requirement met' : 'requirement';
      document.getElementById('req-lower').className = validation.hasLowerCase ? 'requirement met' : 'requirement';
      document.getElementById('req-number').className = validation.hasNumber ? 'requirement met' : 'requirement';
      document.getElementById('req-special').className = validation.hasSpecialChar ? 'requirement met' : 'requirement';

      document.getElementById('req-length').querySelector('.icon').textContent = validation.minLength ? '✅' : '⭕';
      document.getElementById('req-upper').querySelector('.icon').textContent = validation.hasUpperCase ? '✅' : '⭕';
      document.getElementById('req-lower').querySelector('.icon').textContent = validation.hasLowerCase ? '✅' : '⭕';
      document.getElementById('req-number').querySelector('.icon').textContent = validation.hasNumber ? '✅' : '⭕';
      document.getElementById('req-special').querySelector('.icon').textContent = validation.hasSpecialChar ? '✅' : '⭕';
    }

    function checkPasswordMatch() {
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const indicator = document.getElementById('match-indicator');

      if (confirm.length > 0) {
        indicator.style.display = 'flex';
        const match = password === confirm;
        indicator.className = 'match-indicator ' + (match ? 'match-success' : 'match-error');
        indicator.innerHTML = match 
          ? '<span class="icon">✅</span><span>Passwords match</span>'
          : '<span class="icon">❌</span><span>Passwords do not match</span>';
      } else {
        indicator.style.display = 'none';
      }
    }

    function togglePassword(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      
      if (input.type === 'password') {
        input.type = 'text';
        eye.textContent = '🙈';
      } else {
        input.type = 'password';
        eye.textContent = '👁️';
      }
    }

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    // Form submission
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submit-btn');

      // Validate
      const isValid = Object.values(validation).every(v => v);
      if (!isValid) {
        showAlert('Please meet all password requirements.', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match.', 'error');
        return;
      }

      // Submit
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Resetting Password...';

      try {
        const resetUrl = `${API_BASE_URL}/api/password-reset/verify`;
        console.log('📤 Calling password reset API:', resetUrl);

        const response = await fetch(resetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: decodeURIComponent(email),
            token: token,
            newPassword: newPassword
          })
        });

        const data = await response.json();
        console.log('📥 Response:', data);

        if (response.ok && data.success) {
          showAlert('Password reset successfully! Redirecting to sign in...', 'success');
          setTimeout(() => {
            window.location.href = `${FRONTEND_URL}/signin`;
          }, 2000);
        } else {
          showAlert(data.message || 'Failed to reset password. Please try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Reset Password';
        }
      } catch (error) {
        console.error('❌ Reset error:', error);
        showAlert('Network error. Please check your connection and try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
